name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all-targets
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt -- --check
